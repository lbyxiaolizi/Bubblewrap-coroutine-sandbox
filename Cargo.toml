[package]
name = "coroutine-sandbox"
version = "0.5.0"
edition = "2021"
description = "Per-task directory capabilities for Tokio tasks: in-process openat2 data plane + seccomp-hardened bubblewrap exec plane"
publish = false

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "net", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
